# 每周自动取数并更新报告数据
# 美联储资产负债表（H.4.1）周四公布，CFTC 持仓周五公布，所以放在周六跑；
# 周日再跑一次作为补漏：周六已成功、没有新数据时，周日什么都不改。
# GitHub 的定时只认 UTC：13:17 UTC = 美东周六 08:17（冬令时）/ 09:17（夏令时）= 北京时间周六 21:17
name: Weekly update

on:
  schedule:
    - cron: "17 13 * * 6"
    - cron: "17 13 * * 0"
  workflow_dispatch:   # 也可以在 Actions 页面手动点 "Run workflow"
    inputs:
      check:
        description: "只检查数据源能否连通，不写任何数据"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Fetch data and compute
        run: python scripts/update_weekly.py ${{ inputs.check && '--check' || '' }}

      - name: Save results to the repository
        if: ${{ !inputs.check }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有新数据，不提交"
          else
            git commit -m "data: $(python -c "import json;print(json.load(open('data/latest.json'))['date'])")"
            git push
          fi
